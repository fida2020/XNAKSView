# Local development infrastructure for XNAKView.
#
# Bring it up with:
#
#   docker compose -f infrastructure/docker-compose.yml up -d
#
# and point backend/.env at these services (matching backend/.env.example).
# All three services (Postgres, Redis, LiveKit) have been run and verified
# locally, not just written speculatively.

services:
  postgres:
    image: postgres:16-alpine
    container_name: xnakview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xnakview
      POSTGRES_PASSWORD: xnakview_dev_password
      POSTGRES_DB: xnakview_dev
    ports:
      - "5432:5432"
    volumes:
      - xnakview_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xnakview -d xnakview_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xnakview-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - xnakview_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted WebRTC SFU for LIVE streaming (Step 4). Dev-mode keys below
  # are placeholders matching backend/.env.example — replace both before
  # using this anywhere beyond local development. The backend never talks
  # to LiveKit's media ports directly; it only calls the HTTP control API
  # (7880) to create/delete rooms and mint join tokens — actual audio/video
  # flows directly between clients and this server.
  livekit:
    image: livekit/livekit-server:latest
    container_name: xnakview-livekit
    restart: unless-stopped
    command: ["--keys", "devkey: devsecret32characterslongforlocaldev", "--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880" # HTTP/WebSocket signaling + control API
      - "7881:7881" # TCP fallback for WebRTC
      # WebRTC media (narrowed range for local dev). NOT 50000-50100: Windows
      # reserves UDP ports for its own dynamic allocation, and by default
      # that exclusion range covers part or all of 50000-50100 (confirmed via
      # `netsh int ipv4 show excludedportrange protocol=udp`), which makes
      # Docker's port-publish fail with "ports are not available" on a
      # Windows host. 51000-51100 is clear of that reservation. If this still
      # collides on a given machine, check the same netsh command and move
      # the range again — Windows's exclusions shift across reboots.
      - "51000-51100:51000-51100/udp"

volumes:
  xnakview_postgres_data:
  xnakview_redis_data:
